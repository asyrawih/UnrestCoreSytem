name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when the same branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # ---- the three checks CONVENTIONS.md requires, in the order it names them ----

      - name: Sourcemap
        run: rojo sourcemap default.project.json --output sourcemap.json

      - name: Analyze
        run: luau-lsp analyze --definitions=/tmp/globalTypes.d.luau --sourcemap=sourcemap.json $(find src -name '*.luau')

      - name: Lint
        run: selene .

      - name: Format
        run: stylua --check .

      # ---- the invariant no tool can check ----

      - name: Version is the same in both places
        # `Constants.Version` and `src/shared/wally.toml` are the same number written twice,
        # because there is no way to make Luau read a manifest. This is what keeps them honest.
        run: |
          code=$(sed -n 's/.*Version = "\([^"]*\)".*/\1/p' src/shared/Constants.luau | head -1)
          manifest=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' src/shared/wally.toml | head -1)
          echo "Constants.luau : $code"
          echo "wally.toml     : $manifest"
          if [ "$code" != "$manifest" ]; then
            echo "::error::Version mismatch. Move both together."
            exit 1
          fi

      # ---- both project files, because each has a different audience ----

      - name: Build the place
        run: rojo build default.project.json --output /tmp/place.rbxl

      - name: Build the distributable model
        run: rojo build model.project.json --output Unrest.rbxm

      - name: The model must contain the framework and nothing else
        # A publishable artefact that quietly shipped the sample game would be found by
        # whoever installed it, not by us.
        run: |
          rojo sourcemap model.project.json --output /tmp/model.json
          if grep -qE '"(src/game-|plugin/)' /tmp/model.json; then
            echo "::error::model.project.json picked up game or plugin code."
            grep -oE '"[^"]*(src/game-|plugin/)[^"]*"' /tmp/model.json | sort -u
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Unrest-rbxm
          path: Unrest.rbxm
          if-no-files-found: error

      # ---- the plugin, which is its own Rojo project and so its own sourcemap ----

      - name: Plugin sourcemap
        # Rojo writes a sourcemap's paths relative to the project file and luau-lsp resolves
        # them against the working directory, so both have to stand in `plugin/`.
        working-directory: plugin
        run: rojo sourcemap default.project.json --output plugin-sourcemap.json

      - name: Analyze the plugin
        working-directory: plugin
        run: |
          luau-lsp analyze --definitions=/tmp/globalTypes.d.luau \
            --sourcemap=plugin-sourcemap.json $(find src -name '*.luau')

      - name: Build the plugin
        # Never mounted into the place: it is installed into Studio, not replicated to clients.
        run: rojo build plugin/default.project.json --output UnrestPlugin.rbxm

      - uses: actions/upload-artifact@v4
        with:
          name: UnrestPlugin-rbxm
          path: UnrestPlugin.rbxm
          if-no-files-found: error
