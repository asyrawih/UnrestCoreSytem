[package]
name = "asyrawih/unrest-core-system"
version = "0.1.0"
realm = "shared"
registry = "https://github.com/UpliftGames/wally-index"

[dependencies]
# Dipakai kode game untuk remote-nya sendiri. Framework tidak menyentuhnya.
ByteNet = "elitriare/bytenet-max@1.0.0"
# The framework's one dependency. Cleanup scopes: integer handles into Structure-of-Arrays
# storage rather than a container object per scope. Required through `Unrest.Util.Scope`,
# which is the only file allowed to name this path -- two copies of the module would mint
# handles that mean different things.
Scythe = "synttx/scythe@1.2.2"

[dev-dependencies]
